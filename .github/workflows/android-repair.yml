name: Verify Android 0.1.1 repair
on:
  workflow_dispatch:
  push:
    branches: [fix/android-delete-insets]
permissions:
  contents: read
concurrency:
  group: android-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Parse and build checks
        run: |
          node --test tests/parser.test.cjs
          gradle --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native deletion and safe areas on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Prepare unsigned package for private local signing
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/BaoZhang-0.1.1-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" output/apksigner.jar
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 output/BaoZhang-0.1.1-unsigned.apk
          python3 tools/check-apk-alignment.py output/BaoZhang-0.1.1-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BaoZhang-0.1.1-verified-unsigned
          path: output/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-0.1.1-test-reports
          path: app/build/reports/
          retention-days: 14

  signing-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Package minimal local signing runtime
        shell: pwsh
        run: |
          & "$env:JAVA_HOME/bin/jlink.exe" --add-modules java.base,java.logging,java.xml,jdk.crypto.ec --strip-debug --no-header-files --no-man-pages --compress=2 --output signing-jre
          if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare signing runtime' }
          Compress-Archive -LiteralPath signing-jre -DestinationPath windows-jre17.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-local-signing-runtime
          path: windows-jre17.zip
          retention-days: 14
